{% extends "base.html" %}

{% block title %}Sign In - Land Record Digitization{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <div class="card-header" style="text-align: center; justify-content: center;">
      <h3 class="card-title">&#128274; Official Portal Login</h3>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
          <label class="form-label" for="email">Official Email ID</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus value="{{ request.args.get('email', '') }}">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Demo@123" required value="{% if request.args.get('email') %}Demo@123{% endif %}">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <label style="font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem;">
            <input type="checkbox" name="remember"> Remember session
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Sign In to Dashboard</button>
      </form>
    </div>
    <div class="card-footer" style="background: #f8fafc; font-size: 0.825rem; color: var(--text-muted);">
      <b>Quick Demo Fill:</b><br>
      <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap;">
        <button type="button" class="btn btn-sm btn-secondary" onclick="fillCreds('admin@example.com', 'Demo@123')">Admin</button>
        <button type="button" class="btn btn-sm btn-secondary" onclick="fillCreds('revenue@example.com', 'Demo@123')">Revenue Officer</button>
        <button type="button" class="btn btn-sm btn-secondary" onclick="fillCreds('verify@example.com', 'Demo@123')">Verification Officer</button>
      </div>
    </div>
  </div>
</div>

<script>
function fillCreds(email, pass) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pass;
}
</script>
{% endblock %}
