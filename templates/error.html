{% extends "base.html" %}

{% block title %}Error {{ code }} - Land Record System{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <div style="font-size: 4.5rem; font-weight: 800; color: var(--primary); line-height: 1;">{{ code }}</div>
  <h2 style="margin: 1rem 0 0.5rem;">Something went wrong</h2>
  <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">{{ message }}</p>
  <a href="{{ url_for('dashboard.root') }}" class="btn btn-primary">&#8592; Return to Dashboard</a>
</div>
{% endblock %}
